<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compass</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header class="cabc">
        <img src="assets/img/Logo.png" alt="Logo" id="logo">
        <h1 id="tt">Compass</h1>
    </header>
    <main>
        <div id="consult">
            <h2 id="sub-tt">Consultar CEP:</h2>
            <form id="ins-cep">
                <input id="input" type="text" placeholder="Insira o CEP">
                <button type="button" onclick="consulta()" id="btn"><img src="assets/img/img-botao.png" alt="Botão para consultar CEP" id="seta"></button>
            </form>
        </div>
        <div class="informacoes">
            <p class="info">Rua: <span id="rua" class="resposta"></span></p>
            <p class="info">Bairro: <span id="bairro" class="resposta"></span></p>
            <p class="info">Cidade: <span id="cidade" class="resposta"></span></p>
            <p class="info">Estado: <span id="estado" class="resposta"></span></p>
        </div>
    </main>
    <script>
        var dadosCep;
        var cep;

        async function consulta(){
            cep = document.getElementById('input').value;
            
            await fetch(`https://viacep.com.br/ws/${cep}/json/`)
                .then(response => response.json())
                .then(dados => {
                    dadosCep = dados;
                })
                .catch(error =>{
                    alert('Erro na busca do CEP');
                });

            if(dadosCep){
                document.getElementById('rua').textContent = dadosCep.logradouro
                document.getElementById('bairro').textContent = dadosCep.bairro
                document.getElementById('cidade').textContent = dadosCep.localidade
                document.getElementById('estado').textContent = dadosCep.uf + "-" + dadosCep.estado
            } else{
                alert('Erro ao retornar os dados')
            }
        }
    </script>
</body>
</html>
